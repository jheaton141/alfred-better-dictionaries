[package]
name = "bd"
version = "0.4.0"
edition = "2021"
description = "BetterDict importer/migrator (replaces the Python pyapp)"

[dependencies]
anyhow = "1"
flate2 = "1"
plist = "1"
rayon = "1"
regex = "1"
scraper = "0.20"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
