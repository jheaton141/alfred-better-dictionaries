[package]
name = "bd"
version = "0.7.0"
edition = "2021"
publish = false
description = "BetterDict: importer, search index and lookup (replaces the Python pyapp and Meilisearch)"

[dependencies]
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
plist = "1"
rayon = "1"
regex = "1"
scraper = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
