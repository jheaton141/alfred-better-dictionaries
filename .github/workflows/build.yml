name: Build and Release

on: push

jobs:
  build:
    name: Build the Alfred workflow (Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Get workflow version
        run: echo "WF_VERSION=$(plutil -extract version raw -o - info.plist)" >> $GITHUB_ENV
      - name: Test
        run: cd bd && cargo test --release
      - name: Build workflow
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: workflow
          path: "*.alfredworkflow"
      - name: Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$WF_VERSION" ./*.alfredworkflow --title "$WF_VERSION" || gh release upload "$WF_VERSION" ./*.alfredworkflow --clobber
