name: Build bd (Rust importer)

on:
  push:
    paths: ["bd/**", ".github/workflows/bd.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: bd
        run: cargo build --release
      - name: Check binary
        run: |
          file bd/target/release/bd
          bd/target/release/bd version
          cp bd/target/release/bd bd-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: bd-arm64
          path: bd-arm64
      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bd-latest
          name: bd (latest build)
          prerelease: true
          files: bd-arm64
